server:
  port: 8080


logging:
  level:
    org.springframework.ai: DEBUG

spring:
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: "qwen3:8b"
          temperature: 0

notion:
  api-key: ${NOTION_API_KEY}
  database-id: ${NOTION_DATABASE_ID}
  version: ${NOTION_VERSION:2022-06-28}